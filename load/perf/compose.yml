# Layered over chaos/compose.yml for the performance runs: a fixed provider
# delay, no rate limit in the way, and the concurrency and pool under test.
services:
  api:
    environment:
      EMAIL_RATE_PER_SEC: 100000
      LOG_LEVEL: warn
  worker:
    environment:
      EMAIL_RATE_PER_SEC: 100000
      FAKE_PROVIDER_LATENCY_MS: 100
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      LOG_LEVEL: warn
