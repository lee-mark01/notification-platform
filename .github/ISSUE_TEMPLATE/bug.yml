name: 버그
description: 기대와 다르게 동작하는 문제
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 로그, 응답 본문, 스크린샷
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 커밋 또는 브랜치
