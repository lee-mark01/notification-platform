name: notification-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    # BullMQ requires noeviction; evicted keys would silently drop jobs.
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs pending migrations once and exits. The app starts only after it
  # succeeds, because the app itself never runs migrations on boot.
  migrate:
    profiles: ['app']
    # Reuses the image built for app; building it twice under one name collides.
    image: notification-platform-app
    pull_policy: never
    env_file: .env
    environment: &container-env
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    command:
      - node
      - node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy

  app:
    # Opt-in: `docker compose --profile app up`. By default the app runs on the host.
    profiles: ['app']
    build: .
    image: notification-platform-app
    env_file: .env
    environment: *container-env
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      # Readiness, not liveness: the container is healthy only when it can
      # reach MySQL and Redis.
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/health/ready || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
